<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <header class="bg-white border-b-4 border-violet-500 pb-2">

        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">

            <h1 class="text-lg font-bold text-slate-900">Unit Converter</h1>
            <span class="text-xs font-semibold text-blue-700 bg-blue-100 px-3 py-1 rounded-full">CPRG-306-B &middot; Group 8 </span>

        </div>

        <div class="max-w-5xl mx-auto">

            <nav class="flex gap-10 mx-10">

                <button id="weightTab" 
                    class="px-4 py-2 rounded border-2
                    bg-blue-500 ring-2 ring-blue-500 text-white
                    hover:bg-slate-300"> 
                    <!-- The extra elements in this class just lets the user see which tab is initially open when the site loads -->
                    <!-- Hover just provides feedback when interacting with the buttons-->
                    Weight
                </button>

                <button id="distanceTab" 
                    class="px-4 py-2 rounded border-2
                    hover:bg-slate-300">
                    Distance
                </button>

                <button id="temperatureTab" 
                    class="px-4 py-2 rounded border-2
                    hover:bg-slate-300">
                    Temperature
                </button>

            </nav>
        </div>
    </header>
    <main>
        <section id="weightSection"
            class="max-w-3xl mx-auto px-6 py-8">

            <h2 class="text-2xl font-bold mb-6">Weight Converter</h2>

            <div class="grid gap-6 md:grid-cols-2">

                <div class="bg-white p-6 rounded-lg shadow-xl">

                <h3 class="text-lg font-semibold mb-4">Pounds to Kilograms</h3>

                    <label for="poundsInput" 
                        class="block mb-2 font-medium">Pounds:
                    </label>

                    <input id="poundsInput" 
                        type="number" 
                        placeholder="0"
                        class="w-full border-2 rounded px-3 py-2 mb-4">

                    <button id="poundButton"
                        class=" w-full px-4 py-2 bg-blue-500 text-white rounded 
                        hover:bg-blue-600">
                        Convert
                    </button>

                    <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
                        <p class="text-xs uppercase tracking-wide text-slate-500">Kilograms</p>
                        <p id="kgResult" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-xl">

                <h3 class="text-lg font-semibold mb-4">Kilograms to Pounds</h3>

                    <label for="kgInput"
                        class="block mb-2 font-medium">
                        Kilograms:
                    </label>

                    <input id="kgInput" 
                        type="number" 
                        placeholder="0"
                        class="w-full border-2 rounded px-3 py-2 mb-4">

                    <button id="kgButton"
                    class="w-full px-4 py-2 bg-blue-500 text-white rounded
                        hover:bg-blue-600">
                        Convert
                    </button>

                    <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
                        <p class="text-xs uppercase tracking-wide text-slate-500">Pounds</p>
                        <p id="poundResult" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
                  </div>
                </div>
            </div>
        </section>


        <!-- We initially hide the two sections so they arent all trying to appear at once when the page first loads -->
        <!-- Distance Card -->
        <section id="distanceSection"
            class="hidden max-w-3xl mx-auto px-6 py-8">

            <h2 class="text-2xl font-bold mb-6">Distance Converter</h2>
            <div class="grid gap-6 md:grid-cols-2">

                <!-- Miles to Kilometres -->
                <div class="bg-white p-6 rounded-lg shadow-xl">

                    <h3 class="text-lg font-semibold mb-4">Miles to Kilometres</h3>

                    <label for="milesInput"
                        class="block mb-2 font-medium">
                        Miles:
                    </label>

                    <input id="milesInput"
                        type="text"
                        placeholder="0"
                        class="w-full border-2 rounded px-3 py-2 mb-4">

                    <button id="milesButton"
                        class="w-full px-4 py-2 bg-blue-500 text-white rounded
                        hover:bg-blue-600">
                        Convert
                    </button>

                    <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
                        <p class="text-xs uppercase tracking-wide text-slate-500">Kilometres</p>
                        <p id="kmResult" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
                    </div>
                </div>

                <!-- Kilometres to Miles panel -->
                <div class="bg-white p-6 rounded-lg shadow-xl">

                    <h3 class="text-lg font-semibold mb-4">Kilometres to Miles</h3>

                    <label for="kmInput"
                        class="block mb-2 font-medium">
                        Kilometres:
                    </label>

                    <input id="kmInput"
                        type="text"
                        placeholder="0"
                        class="w-full border-2 rounded px-3 py-2 mb-4">

                    <button id="kmButton"
                        class="w-full px-4 py-2 bg-blue-500 text-white rounded
                        hover:bg-blue-600">
                        Convert
                    </button>

                    <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
                        <p class="text-xs uppercase tracking-wide text-slate-500">Miles</p>
                        <p id="milesResult" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
                    </div>
                </div>
            </div>
        </section>

        
        <section id="temperatureSection" 
            class="hidden max-w-3xl mx-auto px-6 py-8">
            <!-- code section for the Temperature Converter. 
             This will be Celsius to Fahrenheit ((Celsius Multiplied by 1.8) then add 32) 
             and Fahrenheit to Celsius ((Fahrenheit -32) divided by 1.8)-->
        </section>
    </main>
    
</body>
<script src="main.js"></script>
</html>
